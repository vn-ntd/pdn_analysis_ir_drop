name: CI — PDN Analysis IR-Drop Test Suite

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
          python -m pip install -e .

      - name: Run full test suite with coverage
        run: python -m pytest tests/ -v --tb=short --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: "Lint (ruff + mypy)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run ruff linter
        run: ruff check core/ simulations/ tests/ dashboard/ --select=E,F,W,I --ignore=E501

      - name: Run mypy type checker
        run: mypy core/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Type hints are additive — warn, not block

  smoke-test:
    name: "Smoke Test — Full Simulation (no plots)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run simulation study (no-plots, quiet, small chip)
        run: |
          python simulations/run_pdn_study.py \
            --chip-size 300.0 \
            --duration-ps 200.0 \
            --dt-ps 10.0 \
            --no-plots \
            --quiet \
            --output-dir /tmp/pdn_output

      - name: Verify JSON output was generated
        run: |
          python -c "
          import json, sys
          with open('/tmp/pdn_output/pdn_results.json') as f:
              d = json.load(f)
          assert 'topologies' in d, 'Missing topologies key'
          assert len(d['topologies']) == 4, f'Expected 4 topologies, got {len(d[\"topologies\"])}'
          print('[PASS] pdn_results.json valid with', len(d['topologies']), 'topologies')
          "

      - name: Test dashboard generator (no server needed)
        run: |
          python dashboard/generate_ui.py \
            --json-path /tmp/pdn_output/pdn_results.json \
            --output /tmp/pdn_dashboard.html

      - name: Verify dashboard HTML was generated
        run: |
          python -c "
          import os
          size = os.path.getsize('/tmp/pdn_dashboard.html')
          assert size > 10000, f'Dashboard too small: {size} bytes'
          with open('/tmp/pdn_dashboard.html') as f:
              content = f.read()
          assert 'pdnData' in content, 'JSON data not embedded in dashboard'
          assert 'tailwindcss.com' in content, 'Tailwind CDN must be official URL'
          assert 'Users/Dung' not in content, 'Hardcoded path found in dashboard!'
          print(f'[PASS] Dashboard OK: {size:,} bytes')
          "

      - name: Upload simulation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdn-simulation-outputs
          path: /tmp/pdn_output/
